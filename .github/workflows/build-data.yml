name: Обновление данных плеера

on:
  schedule:
    - cron: '0 23 * * *'
  push:
    paths:
      - 'channels-list.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install Pillow

      - name: Собрать данные (полностью)
        if: github.event_name != 'push'
        working-directory: scripts
        run: python build_all.py

      - name: Собрать данные (только каналы)
        if: github.event_name == 'push'
        working-directory: scripts
        run: python build_all.py channels-only

      - name: Сохранить изменения обратно в репозиторий
        if: always()
        run: |
          git config user.name "GEN-tv robot"
          git config user.email "actions@github.com"
          git add channels-data.png epg-data.png
          git diff --cached --quiet && echo "Нечего сохранять" || git commit -m "Автообновление данных плеера"
          git push
