<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>!GEN-тв</title>
<link rel="icon" type="image/png" href="https://github.com/GENgroup/TV_logo/blob/main/Favicon.png?raw=true">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
  :root{
    --bg:#000;
    --panel:#14160f;
    --line:#2a2f22;
    --text:#e9ece1;
    --dim:#8a9078;
    --accent:#c9e14a;
    --accent-dim:#5c6b2e;
    --danger:#c96a4a;
    --epg-bar-color: #e0a83d;   /* цвет полоски прогресса передачи (янтарный) */
    --epg-bar-height: 1px;      /* толщина полоски прогресса передачи */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overscroll-behavior:none;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    overflow:hidden;
  }

  /* ============ ОБЩАЯ СЦЕНА (видео) ============ */
  #stage{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #player{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
  }
  #stageMsg{
    position:absolute;
    color:var(--dim);
    font-size:14px;
    text-align:center;
    padding:0 24px;
    line-height:1.6;
    pointer-events:none;
  }
  #stageMsg b{color:var(--text); font-weight:600;}
  #stageMsg a{color:var(--accent); pointer-events:auto;}

  /* зона свайпа громкости - правая ТРЕТЬ экрана (на ПК не мешает мыши -
     см. правило html.mobile-mode ниже, включается только на тач-устройствах) */
  #volZone{
    position:fixed;
    top:0; right:0; bottom:0;
    width:33.33%;
    z-index:5;
    pointer-events:none;
  }
  html.mobile-mode #volZone{ pointer-events:auto; }

  /* зона свайпа переключения канала (влево/вправо) - левые ДВЕ ТРЕТИ экрана */
  #chanZone{
    position:fixed;
    top:0; left:0; bottom:0;
    width:66.66%;
    z-index:5;
    touch-action:none;
    pointer-events:none;
  }
  html.mobile-mode #chanZone{ pointer-events:auto; }
  #volIndicator{
    position:fixed;
    right:16px;
    top:50%;
    transform:translateY(-50%);
    width:32px;
    height:180px;
    background:rgba(255,255,255,.12);
    border-radius:8px;
    z-index:6;
    opacity:0;
    transition:opacity .15s;
    pointer-events:none;
  }
  #volIndicator .fill{
    position:absolute;
    bottom:0; left:0; right:0;
    background:var(--accent-dim);
    border-radius:8px;
    height:60%;
  }
  #volIndicator.show{opacity:1;}

  /* ============ DESKTOP: шапка + правая колонка ============ */
  #desktopHeader{
    position:fixed; top:0; left:0; right:0;
    padding:10px 14px;
    display:flex;
    align-items:baseline;
    gap:10px;
    border-bottom:1px solid var(--line);
    background:rgba(13,15,12,.9);
    z-index:10;
  }
  #desktopHeader .mark{
    font-family:Georgia,"Times New Roman",serif;
    font-style:italic;
    font-size:20px;
    color:var(--accent);
  }
  #desktopHeader .sub{
    font-size:11px; color:var(--dim);
    text-transform:uppercase; letter-spacing:.12em;
  }

  #desktopNav{
    position:fixed;
    top:41px; right:0; bottom:0;
    width:250px;
    border-left:1px solid var(--line);
    overflow-y:auto;
    background:var(--panel);
    z-index:10;
  }
  .grp-title{
    padding:14px 14px 6px;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--dim);
  }
  .ch-row{
    position:relative;
    display:flex; align-items:center; gap:10px;
    padding:5px 14px;
    cursor:pointer;
    border-left:3px solid transparent;
    font-size:14px;
  }
  .ch-row:hover{background:rgba(255,255,255,.03);}
  .ch-row.active{
    border-left-color:var(--accent);
    background:rgba(201,225,74,.08);
    color:var(--accent);
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-dim);flex-shrink:0;}
  .ch-row.active .dot{background:var(--accent);}
  .ch-row.ext .dot{background:var(--danger);}
  .row-logo{
    width:28px; height:28px;
    border-radius:5px;
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;
    background-color:var(--panel);
    flex-shrink:0;
  }
  .ext-tag{
    margin-left:auto; font-size:10px; color:var(--dim);
    border:1px solid var(--line); padding:1px 5px; border-radius:3px;
  }

  /* ---- единая панель управления на ПК (пульт) ---- */
  #desktopToolbar{
    position:fixed;
    top:8px; right:260px;
    z-index:12;
    display:flex; align-items:center; gap:8px;
    background:rgba(20,22,16,.8);
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 10px;
  }
  #desktopVolText{
    font-size:13px;
    color:var(--dim);
    min-width:32px;
    text-align:right;
  }
  #desktopVolSlider{
    width:100px;
    height:20px;
    margin:0;
    -webkit-appearance:none;
    appearance:none;
    background:transparent;
    cursor:pointer;
  }
  #desktopVolSlider::-webkit-slider-runnable-track{
    height:6px;
    border-radius:4px;
    background:#2a2f22;
    border:1px solid var(--line);
  }
  #desktopVolSlider::-moz-range-track{
    height:6px;
    border-radius:4px;
    background:#2a2f22;
    border:1px solid var(--line);
  }
  #desktopVolSlider::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px; height:16px;
    border-radius:50%;
    background:var(--dim);
    border:2px solid #0d0f0c;
    margin-top:-6px;
  }
  #desktopVolSlider::-moz-range-thumb{
    width:16px; height:16px;
    border-radius:50%;
    background:var(--dim);
    border:2px solid #0d0f0c;
  }
  #fsBtn, #desktopStopBtn{
    background:transparent;
    border:none;
    color:var(--text);
    width:28px; height:28px;
    display:none;
    align-items:center; justify-content:center;
    cursor:pointer;
  }
  #fsBtn.show, #desktopStopBtn.show{display:flex;}

  .stop-square{
    width:13px; height:13px;
    background:var(--text);
    border-radius:2px;
    display:block;
  }
  /* значок "развернуть" - два перекрывающихся квадрата (как в Windows) */
  .expand-icon2{
    position:relative;
    width:16px; height:16px;
  }
  .expand-icon2::before, .expand-icon2::after{
    content:'';
    position:absolute;
    width:11px; height:11px;
    border:1.6px solid var(--text);
    border-radius:2px;
  }
  .expand-icon2::before{ top:0; left:0; background:#14160f; }
  .expand-icon2::after{ bottom:0; right:0; background:#14160f; }

  /* всплывающий индикатор громкости на ПК - появляется при прокрутке колеса
     мыши над видео, сам гаснет через секунду */
  /* полоска прогресса текущей передачи - поверх плитки/строки канала */
  .epg-bar{
    position:absolute;
    left:0; right:0; bottom:0;
    height:var(--epg-bar-height);
    background:var(--epg-bar-color);
    pointer-events:none;
  }

  /* блок с названием передачи и прогрессом, показывается ненадолго поверх видео
     после выбора канала (EPG_STAGE_SECONDS в JS настройках) */
  #stageEpg{
    position:fixed;
    left:50%;
    bottom:calc(24px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    z-index:7;
    max-width:80vw;
    padding:8px 16px;
    border-radius:10px;
    background:rgba(10,11,8,.85);
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s;
  }
  #stageEpg.show{ opacity:1; }
  #stageEpg .epg-title{
    font-size:13px;
    color:var(--text);
    margin-bottom:6px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  #stageEpg .epg-track{
    width:220px;
    max-width:60vw;
    height:var(--epg-bar-height);
    background:rgba(255,255,255,.15);
    border-radius:4px;
    overflow:hidden;
  }
  #stageEpg .epg-fill{
    height:100%;
    background:var(--epg-bar-color);
  }

  /* ============ MOBILE: полноэкранная сетка каналов, открыта по умолчанию ============ */
  #mobileGrid{
    position:fixed;
    inset:0;
    z-index:15;
    background:rgba(8,9,6,.97);
    padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    display:none;
  }
  #mobileGrid.open{ display:block; }

  /* ---- ЦВЕТА КАТЕГОРИЙ (динамические) ----
     Цвет каждой группы считается автоматически по формуле ниже в JS
     (блок "НАСТРОЙКИ" перед CHANNELS) - работает для любого числа категорий,
     не только для 4. Крутить сами цвета - там же, числами HUE_START/HUE_STEP/
     CAT_SATURATION/CAT_LIGHTNESS. Тут только общая прозрачность подложки. */
  :root{
    --cat-opacity: 0.24;
    --tile-size: 48px;   /* размер плитки канала (ширина=высота) */
    --tile-gap: 24px;     /* расстояние между плитками */
    --tile-bg-opacity: 1; /* 0-1: фон плитки, см. пояснение у .ch-tile ниже */
    --logo-pad: 5px;     /* поля внутри плитки вокруг логотипа - меньше = логотип крупнее */
  }

  .grid-group{
    border-radius:14px;
    padding:10px 10px 12px;
    margin-bottom:10px;
  }
  .grid-grp-title{
    padding:2px 4px 8px;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--text);
    opacity:.75;
    font-weight:600;
  }

  .grid-wrap{
    display:grid;
    grid-template-columns:repeat(auto-fill, var(--tile-size));
    gap:var(--tile-gap);
    justify-content:start;
  }
  .ch-tile{
    position:relative;
    width:var(--tile-size); height:var(--tile-size);
    border-radius:6px;
    /* фон плитки под логотипом: 1 = непрозрачный тёмный (хорош для лого БЕЗ
       альфа-канала, без него был бы виден белый/цветной прямоугольник);
       0 = полностью прозрачный (хорош для лого С альфа-каналом - просвечивает
       цвет категории). Крути --tile-bg-opacity в самом начале файла, в :root -
       безопасно, можно туда-сюда сколько угодно раз */
    background:rgba(20,22,15, var(--tile-bg-opacity));
    border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:10px;
    font-weight:600;
    color:var(--dim);
    text-align:center;
    line-height:1.1;
    overflow:hidden;
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;
    padding:var(--logo-pad);
  }
  .ch-tile.active{border-color:var(--accent);}
  .ch-tile.ext{border-style:dashed;}

  /* зона свайпа громкости не должна перехватывать браузерный скролл/зум */
  #volZone{ touch-action:none; }

  #gridCloseBtn{
    position:fixed;
    top:calc(10px + env(safe-area-inset-top));
    left:10px;
    z-index:16;
    width:44px; height:44px;
    border-radius:8px;
    background:rgba(20,22,16,.75);
    border:1px solid var(--line);
    color:var(--text);
    font-size:20px;
    display:none;
    align-items:center; justify-content:center;
  }
  #gridOpenBtn{
    position:fixed;
    top:calc(10px + env(safe-area-inset-top));
    left:10px;
    z-index:11;
    width:44px; height:44px;
    border-radius:8px;
    background:rgba(20,22,16,.75);
    border:1px solid var(--line);
    color:var(--text);
    font-size:22px;
    display:none;
    align-items:center; justify-content:center;
  }
  #mobileExpandBtn{
    position:fixed;
    top:calc(10px + env(safe-area-inset-top));
    right:10px;
    z-index:11;
    width:44px; height:44px;
    border-radius:8px;
    background:rgba(20,22,16,.75);
    border:1px solid var(--line);
    display:none;
    align-items:center; justify-content:center;
  }
  .expand-icon{
    width:16px; height:16px;
    border:2px solid var(--text);
    border-radius:2px;
    display:block;
  }

  /* ============ layout switch (определяем по классу на <html>, не по ширине) ============ */
  .only-desktop{display:block;}
  .only-mobile{display:none;}

  html.mobile-mode .only-desktop{display:none !important;}
  html.mobile-mode #fsBtn{display:none !important;}
  html.mobile-mode #gridOpenBtn{display:flex !important;}
</style>
</head>
<body>

<!-- DESKTOP CHROME -->
<header id="desktopHeader" class="only-desktop">
  <span class="mark">!GEN-тв</span><span class="sub" style="margin-left:6px;opacity:.5">ИТОГ-1</span>
  <span class="sub">личная подборка</span>
</header>
<nav id="desktopNav" class="only-desktop"></nav>
<div id="desktopToolbar" class="only-desktop">
  <span id="desktopVolText">50%</span>
  <input type="range" id="desktopVolSlider" min="0" max="1000" value="500" title="Громкость">
  <button id="desktopStopBtn" title="Стоп"><span class="stop-square"></span></button>
  <button id="fsBtn" title="Во весь экран"><span class="expand-icon2"></span></button>
</div>

<!-- STAGE (общий для обеих версий) -->
<div id="stage">
  <video id="player" playsinline webkit-playsinline></video>
  <iframe id="playerFrame" allow="autoplay" style="display:none;"></iframe>
  <div id="stageMsg">Канал</div>
</div>
<div id="stageEpg">
  <div class="epg-title"></div>
  <div class="epg-track"><div class="epg-fill"></div></div>
</div>
<button id="gridOpenBtn" title="Каналы">▦</button>
<button id="mobileExpandBtn" title="На весь экран"><span class="expand-icon"></span></button>

<div id="volZone"></div>
<div id="volIndicator"><div class="fill"></div></div>
<div id="chanZone"></div>

<!-- MOBILE: полноэкранная сетка, открыта по умолчанию на входе -->
<div id="mobileGrid" class="only-mobile">
  <div id="gridInner"></div>
</div>

<script>
// ---- твой список каналов -------------------------------------------------
// ==================== ЗАГРУЗКА СПИСКА КАНАЛОВ ====================
// Список каналов больше не зашит прямо в код - он хранится ОТДЕЛЬНО,
// закодированный внутри обычной картинки (channels-data.png), лежащей на
// GitHub. Так сделано специально: этот файл открывается с диска (file://),
// а такие страницы вообще не могут напрямую скачивать текстовые файлы
// (JSON/XML) откуда-либо - браузер это запрещает. А вот КАРТИНКИ - можно,
// это работает совсем по другим правилам. Поэтому список "прячется" внутри
// картинки, а код ниже её "распаковывает" обратно в текст.
//
// ЧТОБЫ ОБНОВИТЬ СПИСОК КАНАЛОВ: меняешь channels-list.json (обычный
// текстовый файл, легко редактировать), пересобираешь картинку заново
// (отдельным скриптом) и заливаешь новую картинку на GitHub вместо старой -
// сам этот HTML-файл трогать не нужно вообще.
const CHANNELS_IMAGE_URL = "https://raw.githubusercontent.com/GENgroup/TV_logo/main/channels-data.png";

let CHANNELS = []; // заполнится после расшифровки картинки, до этого - пусто

function decodeChannelsFromImage(url){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous"; // просим разрешения читать пиксели
    img.onload = () => {
      try{
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const data = ctx.getImageData(0, 0, img.width, img.height).data;

        // читаем все "слоты" (R,G,B каждого пикселя по очереди) как ниббл-значения,
        // округляя к ближайшему кратному 17 - так небольшое искажение цвета (замечено
        // на практике: сдвиг на ±1) не портит результат
        function readNibble(v){
          const n = Math.round(v / 17);
          return Math.max(0, Math.min(15, n));
        }
        const slots = [];
        // картинка теперь прямоугольная (не одна строка) - поэтому перебираем
        // ВСЕ пиксели (ширина * высота), а не только первую строку
        const totalPixels = img.width * img.height;
        for (let p = 0; p < totalPixels; p++){
          const off = p * 4;
          slots.push(readNibble(data[off]), readNibble(data[off+1]), readNibble(data[off+2]));
        }
        function nibblesToBytes(nibbles, count){
          const out = [];
          for (let i = 0; i < count; i++){
            out.push((nibbles[i*2] << 4) | nibbles[i*2+1]);
          }
          return out;
        }
        const headerBytes = nibblesToBytes(slots, 4);
        const length = (headerBytes[0]<<24) | (headerBytes[1]<<16) | (headerBytes[2]<<8) | headerBytes[3];
        const payloadNibbles = slots.slice(8, 8 + length*2);
        const bytes = nibblesToBytes(payloadNibbles, length);

        const text = new TextDecoder('utf-8').decode(new Uint8Array(bytes));
        const parsed = JSON.parse(text);
        resolve(parsed.groups || []);
      } catch(e){
        reject(e);
      }
    };
    img.onerror = () => reject(new Error('картинка со списком каналов не загрузилась'));
    img.src = url;
  });
}

// ---------------------------------------------------------------------------

// ==================== НАСТРОЙКИ (крутить тут) ====================
// Цвет каждой категории считается автоматически по кругу цветового круга (HSL),
// поэтому работает для любого числа групп - хоть 3, хоть 12, каждая получит
// свой оттенок без ручной прописи цвета под каждую.
const HUE_START = 205;        // с какого оттенка начинать (0-360, цветовой круг)
const HUE_STEP  = 47;         // на сколько градусов сдвигать цвет для каждой следующей группы
const CAT_SATURATION = 60;    // насыщенность цвета подложки, % (0-100)
const CAT_LIGHTNESS  = 60;    // светлота цвета подложки, % (0-100) - повышено для дневного света
// прозрачность подложки (--cat-opacity) и размер/отступы плиток (--tile-size,
// --tile-gap, --logo-pad) - там же, где остальные цвета, в блоке :root в начале файла
// ====================================================================

function categoryColor(idx){
  const hue = (HUE_START + idx * HUE_STEP) % 360;
  return `hsla(${hue}, ${CAT_SATURATION}%, ${CAT_LIGHTNESS}%, var(--cat-opacity))`;
}

const desktopNav = document.getElementById('desktopNav');
const gridInner = document.getElementById('gridInner');
const mobileGrid = document.getElementById('mobileGrid');
const gridOpenBtn = document.getElementById('gridOpenBtn');
const video = document.getElementById('player');
const iframeEl = document.getElementById('playerFrame');
const stageMsg = document.getElementById('stageMsg');
const fsBtn = document.getElementById('fsBtn');
const stage = document.getElementById('stage');
let hls = null;
let activeDesktopEl = null;
let activeMobileEl = null;
let playableChannels = [];  // плоский список каналов для свайпа влево/вправо
let currentPlayIndex = -1;  // на каком канале сейчас стоим в этом списке

// планшет/телефон определяем по touch-возможностям, а не по ширине экрана -
// планшет в альбомной ориентации может быть шире 720px, но это всё равно тач-устройство
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isTouch) document.documentElement.classList.add('mobile-mode');

function tileContent(ch){
  if (ch.logo) return '';
  const words = ch.name.split(' ');
  return words.length > 1 ? (words[0][0] + words[1][0]) : ch.name.slice(0,3);
}

function render(){
  desktopNav.innerHTML = '';
  gridInner.innerHTML = '';
  playableChannels = []; // плоский список для свайпа переключения (без ext и disabled)

  CHANNELS.forEach((g, idx) => {
    const h = document.createElement('div');
    h.className = 'grp-title';
    h.textContent = g.group;
    desktopNav.appendChild(h);

    // цветная подложка категории на мобильной сетке - цвет считается формулой
    // (см. блок НАСТРОЙКИ вверху), работает для любого числа групп
    const groupBox = document.createElement('div');
    groupBox.className = 'grid-group';
    groupBox.style.background = categoryColor(idx);

    const gh = document.createElement('div');
    gh.className = 'grid-grp-title';
    gh.textContent = g.group;
    groupBox.appendChild(gh);

    const wrap = document.createElement('div');
    wrap.className = 'grid-wrap';
    groupBox.appendChild(wrap);
    gridInner.appendChild(groupBox);

    g.items.forEach(ch => {
      if (ch.disabled) return; // выключенный канал - просто не рисуем

      // desktop row
      const row = document.createElement('div');
      row.className = 'ch-row' + (ch.type === 'ext' ? ' ext' : '');
      const logoImg = ch.logo ? `<span class="row-logo" style="background-image:url('${ch.logo}')"></span>` : `<span class="dot"></span>`;
      row.innerHTML = logoImg + `<span>${ch.name}</span>` +
        (ch.type === 'ext' ? '<span class="ext-tag">сайт</span>' : '');
      row.addEventListener('click', () => selectChannel(ch, row, null));
      desktopNav.appendChild(row);

      // mobile grid tile (без подписи под плиткой - только лого/инициалы)
      const tile = document.createElement('div');
      tile.className = 'ch-tile' + (ch.type === 'ext' ? ' ext' : '');
      if (ch.logo){
        tile.style.backgroundImage = `url('${ch.logo}')`;
      } else {
        tile.textContent = tileContent(ch);
      }
      tile.title = ch.name;
      tile.addEventListener('click', () => selectChannel(ch, row, tile));
      wrap.appendChild(tile);

      if (ch.type !== 'ext'){
        playableChannels.push({ ch, row, tile });
      }
    });
  });
}

function selectChannel(ch, row, tile){
  if (activeDesktopEl) activeDesktopEl.classList.remove('active');
  if (row){ row.classList.add('active'); activeDesktopEl = row; }

  if (activeMobileEl) activeMobileEl.classList.remove('active');
  if (tile){ tile.classList.add('active'); activeMobileEl = tile; }

  if (ch.type === 'ext'){
    window.open(ch.url, '_blank');
    showMsg(`<b>${ch.name}</b><br>Нет прямого потока — открыл сайт канала во вкладке.`);
    stopAll();
    fsBtn.classList.remove('show'); desktopStopBtn.classList.remove('show');
    return;
  }

  if (ch.type === 'iframe'){
    hideMsg();
    playIframe(ch);
    closeGrid();
    currentPlayIndex = playableChannels.findIndex(p => p.ch === ch);
    if (isTouch) goFullscreen();
    return;
  }

  hideMsg();
  playStream(ch);
  closeGrid();
  currentPlayIndex = playableChannels.findIndex(p => p.ch === ch);
  if (isTouch) goFullscreen();
}

// свайп влево/вправо переключает на предыдущий/следующий играющий канал
// по общему порядку списка (сквозь все категории, без сайтовых и отключённых)
function switchChannel(direction){
  if (playableChannels.length === 0) return;
  let idx = currentPlayIndex;
  if (idx < 0) idx = 0;
  idx = (idx + direction + playableChannels.length) % playableChannels.length;
  const p = playableChannels[idx];
  selectChannel(p.ch, p.row, p.tile);
}

function stopAll(){
  if (hls){ hls.destroy(); hls = null; }
  video.pause();

// type "stream": обычный HLS-поток (.m3u8) - играет через hls.js в <video>
// принимает не url, а весь объект канала - нужен для показа имени в сообщении об ошибке
function playStream(ch){
  const url = ch.url;
  if (hls){ hls.destroy(); hls = null; }
  iframeEl.style.display = 'none';
  iframeEl.src = 'about:blank';
  video.style.display = 'block';

  if (Hls.isSupported()){
    hls = new Hls({ maxBufferLength: 20 });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
    hls.on(Hls.Events.ERROR, (evt, data) => {
      if (data.fatal){
        const logoHtml = ch.logo ? `<img src="${ch.logo}" style="width:40px;height:40px;object-fit:contain;display:block;margin:0 auto 8px;border-radius:8px;">` : '';
        showMsg(`${logoHtml}<b>${ch.name}</b> не отвечает.<br>Попробуй другой.`);
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')){
    video.src = url;
    video.play().catch(()=>{});
  } else {
    showMsg('Браузер не поддерживает поток.');
  }
  fsBtn.classList.add('show'); desktopStopBtn.classList.add('show');
  somethingPlaying = true;
  updateExpandBtnVisibility();
  showEpgProgressOnStage(ch);
}

// type "iframe": страница-плеер чужого сайта (например player.smotrim.ru/iframe/...)
// встраивается как есть. ЧЕСТНО: часть сайтов запрещает встраивание себя (X-Frame-Options) -
// такие каналы просто останутся пустым/белым окном, тут заранее не угадать, надо пробовать.

// числа с учётом ширины боковой панели 250px) - пересчёт через JS не нужен

// ---- ПК: постоянный ползунок громкости, "перекошенная" шкала ----
// Обычный линейный ползунок (0-100 = 0-100% громкости напрямую) сжимает всю
// тихую зону в первые пару миллиметров - ухо тихие звуки различает гораздо
// тоньше, чем громкие, поэтому линейная шкала там бесполезна.
// Тут ползунок (0-1000 для плавности) - это не сама громкость, а "позиция",
// которая переводится в громкость через степенную кривую (**VOLUME_CURVE):
// чем больше VOLUME_CURVE, тем сильнее растянута тихая часть шкалы.
//   позиция 0.2 (20% хода ползунка) при VOLUME_CURVE=2 даёт громкость 0.04 (4%)
//   позиция 0.2 при VOLUME_CURVE=3 даёт громкость 0.008 (ещё тише) - тише зона ещё растянутее
const VOLUME_CURVE = 2.5;      // 1 = обычная линейная шкала, больше = тихая зона растянута сильнее
const VOLUME_DEFAULT_POS = 0.5; // положение ползунка при первом запуске (0-1), не сама громкость

function posToVolume(pos){ return Math.pow(pos, VOLUME_CURVE); }
function volumeToPos(vol){ return Math.pow(Math.max(0, vol), 1 / VOLUME_CURVE); }

function loadSavedVolumePos(){
  const saved = localStorage.getItem('tv_volume_pos');
  return saved !== null ? parseFloat(saved) : VOLUME_DEFAULT_POS;
}
function saveVolumePos(pos){
  try{ localStorage.setItem('tv_volume_pos', pos); } catch(e){}
}

const desktopVolText = document.getElementById('desktopVolText');
function updateDesktopVolText(){
  desktopVolText.textContent = Math.round(video.volume * 100) + '%';
}

desktopVolSlider.addEventListener('input', () => {
  const pos = desktopVolSlider.value / 1000;
  applyVolumePos(pos);
});

// колёсико мыши над видео - двигает то же самое значение, что и слайдер,
// и держит слайдер визуально в синхроне (шаг WHEEL_STEP - доля хода ползунка)
const WHEEL_STEP = 0.08;
function applyVolumePos(pos){
  pos = Math.max(0, Math.min(1, pos));
  video.volume = posToVolume(pos);
  desktopVolSlider.value = Math.round(pos * 1000);
  saveVolumePos(pos);
  updateDesktopVolText();
}
stage.addEventListener('wheel', (e) => {
  if (isTouch) return; // на мобильном громкость - свайпом, колесо мыши там ни при чём
  e.preventDefault();
  const currentPos = desktopVolSlider.value / 1000;
  applyVolumePos(currentPos + (e.deltaY < 0 ? WHEEL_STEP : -WHEEL_STEP));
}, { passive:false });

const initialVolPos = loadSavedVolumePos();
desktopVolSlider.value = Math.round(initialVolPos * 1000);
video.volume = posToVolume(initialVolPos); // применяем сохранённую громкость сразу, один раз на весь сеанс
updateDesktopVolText();

// ---- mobile: swipe on left half = переключение канала (влево - пред., вправо - след.) ----
const chanZone = document.getElementById('chanZone');
let touchStartXC = null;
const SWIPE_THRESHOLD = 60; // px, минимальная длина свайпа, чтобы засчитать переключение

chanZone.addEventListener('touchstart', (e) => {
  touchStartXC = e.touches[0].clientX;
}, { passive:true });

chanZone.addEventListener('touchend', (e) => {
  if (touchStartXC === null) return;
  const dx = e.changedTouches[0].clientX - touchStartXC;
  touchStartXC = null;
  if (Math.abs(dx) < SWIPE_THRESHOLD) return; // короткий тап/дрожание - не свайп
  // свайп влево (палец идёт вправо->влево, dx отрицательный) = предыдущий канал
  // свайп вправо (dx положительный) = следующий канал

// =====================================================================
// EPG (телепрограмма: название передачи и % прогресса "сколько прошло")
// =====================================================================
// ГЛАВНЫЙ ВЫКЛЮЧАТЕЛЬ - поставь false, чтобы полностью отключить EPG
// (ни скачивания, ни показа - как будто этой части кода нет вообще)
const EPG_ENABLED = true;

// источник по умолчанию - один файл на ВСЕ каналы разом
const EPG_DEFAULT_SOURCE = "https://raw.githubusercontent.com/GENgroup/TV_logo/main/russia1.xml.gz";

// как часто перекачивать EPG заново, в часах (программа передач не меняется
// каждую минуту, поэтому кэшируем в localStorage браузера и не дёргаем сеть зря)
const EPG_REFRESH_HOURS = 24;

// сколько секунд показывать прогресс-полосу и название передачи поверх видео
// сразу после выбора канала (потом сама прячется)
const EPG_STAGE_SECONDS = 8;

// ЧТОБЫ ДАТЬ КАНАЛУ СВОЙ ОТДЕЛЬНЫЙ ИСТОЧНИК EPG (если его нет в общем источнике
// выше, но есть какой-то ещё), допиши в объекте канала в CHANNELS два поля:
//   epgSource: "https://адрес/другого/файла.xml" (или .xml.gz)
//   epgId:     "как канал называется или какой у него id внутри ЭТОГО файла"
// Пример:
//   { name: "Редкий канал", type: "stream", url: "...", logo: "...",
//     epgSource: "https://example.com/epg.xml", epgId: "RareChannel1" },
// Если этих двух полей нет - канал молча использует общий EPG_DEFAULT_SOURCE
// по своему обычному имени (name). Ничего не сработало - бара просто не будет,
// без ошибок и без надписей "нет данных" - тихо.

let epgByName = {};  // { "Имя канала (как в CHANNELS)": [{start,stop,title}, ...] }
let epgAlt = {};     // { "источник|epgId": [{start,stop,title}, ...] }

// =====================================================================
// РЕЖИМ ДЕМО: EPG прямо сейчас берётся не из интернета (fetch с этим не
// справится на file:// — та же причина, по которой список каналов лежит
// в картинке), а из картинки epg-demo.png, лежащей рядом с этим HTML-файлом.
// Внутри картинки лежит JSON вида { "Имя канала": [{start,stop,title},...] } —
// то есть ровно то, что раньше собирал parseEpgXml() из XML.
// Когда определимся с реальным источником на все каналы - этот блок
// заменится на пересборку такой же картинки, но с полными данными.
// картинка с полным расписанием (программа передач) на все каналы.
// Лежит на GitHub рядом с channels-data.png - обновляется точно так же:
// пересобрал картинку скриптом encode_to_png.py -> залил на GitHub поверх
// старой -> сам этот HTML трогать не нужно.
const EPG_DEMO_IMAGE_URL = "https://raw.githubusercontent.com/GENgroup/TV_logo/main/epg-data.png";

function decodeImageToObject(url){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous"; // картинка теперь с GitHub - просим разрешения читать пиксели
    img.onload = () => {
      try{
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const data = ctx.getImageData(0, 0, img.width, img.height).data;
        function readNibble(v){
          const n = Math.round(v / 17);
          return Math.max(0, Math.min(15, n));
        }
        const slots = [];
        // картинка теперь прямоугольная (не одна строка) - поэтому перебираем
        // ВСЕ пиксели (ширина * высота), а не только первую строку
        const totalPixels = img.width * img.height;
        for (let p = 0; p < totalPixels; p++){
          const off = p * 4;
          slots.push(readNibble(data[off]), readNibble(data[off+1]), readNibble(data[off+2]));
        }
        function nibblesToBytes(nibbles, count){
          const out = [];
          for (let i = 0; i < count; i++){
            out.push((nibbles[i*2] << 4) | nibbles[i*2+1]);
          }
          return out;
        }
        const headerBytes = nibblesToBytes(slots, 4);
        const length = (headerBytes[0]<<24) | (headerBytes[1]<<16) | (headerBytes[2]<<8) | headerBytes[3];
        const payloadNibbles = slots.slice(8, 8 + length*2);
        const bytes = nibblesToBytes(payloadNibbles, length);
        const text = new TextDecoder('utf-8').decode(new Uint8Array(bytes));
        resolve(JSON.parse(text));
      } catch(e){ reject(e); }
    };
    img.onerror = () => reject(new Error('картинка "' + url + '" не загрузилась'));
    img.src = url;
  });
}

function epgCacheGet(key){
  try{
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (Date.now() - obj.ts > EPG_REFRESH_HOURS * 3600 * 1000) return null; // протухло
    return obj.data;
  } catch(e){ return null; }
}
function epgCacheSet(key, data){
  try{
    localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data }));
  } catch(e){ /* хранилище переполнено/недоступно - просто не кэшируем, не страшно */ }
}

// скачивает и, если файл .gz, распаковывает прямо в браузере (без сторонних
// библиотек - у современных браузеров DecompressionStream встроен)
async function fetchEpgSource(url){
  const resp = await fetch(url);
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  if (url.endsWith('.gz')){
    const stream = resp.body.pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).text();
  }
  return await resp.text();
}

// разбирает XMLTV-файл, оставляя только те каналы, что реально нужны
// (wantedNames - Set с именами, которые ищем среди <display-name>)
function parseEpgXml(xmlText, wantedNames){
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  const idToName = {};
  const result = {};

  const channelEls = doc.getElementsByTagName('channel');
  for (const chEl of channelEls){
    const id = chEl.getAttribute('id');
    const names = chEl.getElementsByTagName('display-name');
    for (const dn of names){
      const nm = (dn.textContent || '').trim();
      if (wantedNames.has(nm)){
        idToName[id] = nm;
        result[nm] = [];
        break;
      }
    }
  }

  const progEls = doc.getElementsByTagName('programme');
  for (const p of progEls){
    const nm = idToName[p.getAttribute('channel')];
    if (!nm) continue;
    const titleEl = p.getElementsByTagName('title')[0];
    result[nm].push({
      start: p.getAttribute('start'),
      stop: p.getAttribute('stop'),
      title: titleEl ? titleEl.textContent : ''
    });
  }
  return result;
}

// формат даты в XMLTV: "20260817120000 +0300"
function parseXmltvDate(s){
  const m = /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\s*([+-]\d{4})?$/.exec(s || '');
  if (!m) return null;
  let iso = `${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}`;
  iso += m[7] ? (m[7].slice(0,3) + ':' + m[7].slice(3)) : 'Z';
  const d = new Date(iso);
  return isNaN(d) ? null : d;
}

// находит текущую (прямо сейчас идущую) передачу в списке и % прогресса
function currentProgress(programmes){
  if (!programmes || !programmes.length) return null;
  const now = Date.now();
  for (const p of programmes){
    const start = parseXmltvDate(p.start);
    const stop = parseXmltvDate(p.stop);
    if (!start || !stop) continue;
    if (now >= start.getTime() && now < stop.getTime()){
      const pct = Math.round((now - start.getTime()) / (stop.getTime() - start.getTime()) * 100);
      return { pct: Math.max(0, Math.min(100, pct)), title: p.title };
    }
  }
  return null;
}

function programmesFor(ch){
  if (ch.epgSource){
    return epgAlt[ch.epgSource + '|' + (ch.epgId || ch.name)] || [];
  }
  return epgByName[ch.name] || [];
}

// рисует/обновляет янтарную полоску снизу плитки (мобильный) и строки (ПК)
function renderEpgBars(){
  if (!EPG_ENABLED) return;
  playableChannels.forEach(p => {
    const prog = currentProgress(programmesFor(p.ch));
    [p.tile, p.row].forEach(el => {
      if (!el) return;
      let bar = el.querySelector('.epg-bar');
      if (!prog){
        if (bar) bar.remove();
        return;
      }
      if (!bar){
        bar = document.createElement('div');
        bar.className = 'epg-bar';
        el.appendChild(bar);
      }
      bar.style.width = prog.pct + '%';
    });
  });
}

// показывает название передачи и прогресс поверх видео на несколько секунд
// после выбора канала (EPG_STAGE_SECONDS), потом само прячется
function showEpgProgressOnStage(ch){
  if (!EPG_ENABLED) return;
  const prog = currentProgress(programmesFor(ch));
  const box = document.getElementById('stageEpg');
  if (!prog){ box.classList.remove('show'); return; }
  box.querySelector('.epg-title').textContent = prog.title;
  box.querySelector('.epg-fill').style.width = prog.pct + '%';
  box.classList.add('show');
  clearTimeout(showEpgProgressOnStage._t);
  showEpgProgressOnStage._t = setTimeout(() => box.classList.remove('show'), EPG_STAGE_SECONDS * 1000);
}

async function initEpg(){
  if (!EPG_ENABLED) return;

  try{
    epgByName = await decodeImageToObject(EPG_DEMO_IMAGE_URL);
    console.log('EPG: загружено каналов -', Object.keys(epgByName).length);
  } catch(e){
    console.warn('EPG: картинка не загрузилась -', e.message);
    epgByName = {};
  }

  renderEpgBars();
}

// раз в минуту пересчитывать полоски (передача идёт, % растёт само)
setInterval(renderEpgBars, 60000);

// ---- запуск: сначала расшифровываем список каналов из картинки, потом всё остальное ----
stageMsg.textContent = 'Загрузка списка каналов...';
decodeChannelsFromImage(CHANNELS_IMAGE_URL)
  .then(groups => {
    CHANNELS = groups;
    hideMsg();
    render();
    if (EPG_ENABLED) initEpg();
  })
  .catch(err => {
    console.error('Не удалось загрузить список каналов:', err);
    showMsg('Не удалось загрузить список каналов.<br>' + err.message);
  });
</script>
